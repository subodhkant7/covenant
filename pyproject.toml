[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "covenant"
version = "0.1.0"
description = "Autonomous commitment-resolution agent system"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Covenant Engineering Team" }
]
dependencies = [
    "pydantic>=2.7.0,<3",
    "fastapi>=0.111.0,<1",
    "uvicorn>=0.30.0,<1",
    "httpx>=0.27.0,<1",
    "strands-agents>=1.54.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "covenant*",
    "agent_runtime*",
    "covenant_runtime_bridge*",
]
exclude = [
    "frontend*",
    "tests*",
]

[tool.setuptools.package-data]
"*" = ["*.sql"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"

